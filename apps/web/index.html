<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#233b78"><link rel="manifest" href="/manifest.webmanifest"><title>EduFix</title><style>:root{--blue:#233b78;--ink:#172033;--muted:#667085;--line:#e7eaf0;--bg:#f5f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}.app{display:flex;min-height:100vh}.sidebar{width:245px;background:#fff;border-right:1px solid var(--line);padding:24px 16px}.brand{color:var(--blue);margin:0 12px 36px;font-size:24px}.nav button{display:block;width:100%;border:0;text-align:left;background:transparent;color:#596579;padding:12px;border-radius:10px;margin:4px 0;font-weight:600}.nav button:hover,.nav button.active{background:#eef2ff;color:var(--blue)}.main{flex:1;padding:30px 36px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top h1{margin:0;font-size:28px}.user{color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 4px 16px #18274b0a}.label{font-size:14px;color:var(--muted)}.metric{font-size:30px;font-weight:800;color:var(--blue);margin-top:8px}.section{margin-top:24px}.section h2{font-size:18px}.table{width:100%;background:#fff;border-collapse:collapse;border:1px solid var(--line)}th,td{text-align:left;padding:13px;border-bottom:1px solid var(--line);font-size:14px}th{color:var(--muted);background:#fafbfe}.badge{padding:5px 9px;border-radius:999px;background:#eef2ff;color:var(--blue);font-weight:650;font-size:12px}.login{min-height:100vh;display:grid;place-items:center}.form{width:min(420px,calc(100vw - 32px));background:#fff;padding:26px;border-radius:14px;border:1px solid var(--line)}label{display:block;margin:14px 0 7px;font-weight:650;font-size:14px}input,textarea,select{width:100%;padding:11px;border:1px solid #d8deea;border-radius:8px;font:inherit}.button{border:0;border-radius:9px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:650}.error{color:#b42318;background:#fff0ee;padding:10px;border-radius:8px;margin:12px 0}.muted{color:var(--muted)}.hidden{display:none}@media(max-width:800px){.sidebar{width:76px;padding:18px 8px}.brand{font-size:0;text-align:center;margin:0 0 24px}.brand:after{content:'E';font-size:24px}.nav button{font-size:0;text-align:center}.nav button:after{content:'•';font-size:22px}.main{padding:18px 12px}.grid{grid-template-columns:repeat(2,1fr)}.top h1{font-size:22px}}</style></head><body><div id="root"></div><script>
const API='http://localhost:4000/api/v1';let token=localStorage.getItem('edufix_token');let user=null;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,opts={}){const r=await fetch(API+path,{...opts,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,...(opts.headers||{})}});const data=await r.json();if(!r.ok)throw Error(data.message||'Có lỗi xảy ra');return data}function login(){root.innerHTML='<main class="login"><form class="form" id="login"><h1 style="color:var(--blue)">EduFix</h1><p class="muted">Quản lý tài sản và sự cố thiết bị trường học</p><div id="err"></div><label>Email</label><input id="email" type="email" value="manager@edufix.local" required><label>Mật khẩu</label><input id="password" type="password" value="ChangeMe123!" required><button class="button" style="width:100%;margin-top:20px">Đăng nhập</button><p class="muted" style="font-size:12px">Demo: manager@edufix.local / ChangeMe123!</p></form></main>';$('#login').onsubmit=async e=>{e.preventDefault();try{const d=await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#email').value,password:$('#password').value})}).then(r=>r.json());if(!d.accessToken)throw Error(d.message);token=d.accessToken;localStorage.setItem('edufix_token',token);await start()}catch(e){$('#err').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}}async function start(){if(!token)return login();try{user=await api('/auth/me');dashboard()}catch{localStorage.removeItem('edufix_token');token='';login()}}function shell(title,content){root.innerHTML='<div class="app"><aside class="sidebar"><h2 class="brand">EduFix</h2><nav class="nav"><button id="nav-dashboard">Dashboard</button><button id="nav-assets">Thiết bị</button><button id="nav-incidents">Sự cố</button><button id="nav-scan">Báo sự cố QR</button><button id="logout">Đăng xuất</button></nav></aside><main class="main"><div class="top"><h1>'+title+'</h1><div class="user">'+esc(user.fullName)+' · '+esc(user.role)+'</div></div>'+content+'</main></div>';$('#nav-dashboard').onclick=dashboard;$('#nav-assets').onclick=assets;$('#nav-incidents').onclick=incidents;$('#nav-scan').onclick=scan;$('#logout').onclick=()=>{localStorage.clear();token='';login()}}async function dashboard(){const d=await api('/dashboard/summary');shell('Tổng quan','<div class="grid"><div class="card"><span class="label">Tổng thiết bị</span><div class="metric">'+d.assets+'</div></div><div class="card"><span class="label">Đang hỏng</span><div class="metric">'+d.faulty+'</div></div><div class="card"><span class="label">Sự cố đang mở</span><div class="metric">'+d.open+'</div></div><div class="card"><span class="label">Quá hạn</span><div class="metric">'+d.overdue+'</div></div></div><section class="section"><h2>Phiếu sự cố gần đây</h2>'+incidentTable(d.recent)+'</section>')}function incidentTable(items){return '<table class="table"><thead><tr><th>Mã phiếu</th><th>Tiêu đề</th><th>Thiết bị</th><th>Ưu tiên</th><th>Trạng thái</th></tr></thead><tbody>'+items.map(i=>'<tr><td>'+esc(i.incidentCode)+'</td><td>'+esc(i.title)+'</td><td>'+esc(i.asset?.name)+'</td><td><span class="badge">'+esc(i.priority)+'</span></td><td>'+esc(i.status)+'</td></tr>').join('')+'</tbody></table>'}async function assets(){const data=await api('/assets');shell('Thiết bị','<section class="section">'+assetTable(data)+'</section>')}function assetTable(items){return '<table class="table"><thead><tr><th>Mã tài sản</th><th>Tên thiết bị</th><th>Vị trí</th><th>Trạng thái</th><th>QR token</th></tr></thead><tbody>'+items.map(a=>'<tr><td>'+esc(a.assetCode)+'</td><td>'+esc(a.name)+'</td><td>'+esc(a.location)+'</td><td><span class="badge">'+esc(a.status)+'</span></td><td>'+esc(a.qrToken)+'</td></tr>').join('')+'</tbody></table>'}async function incidents(){const data=await api('/incidents');shell('Phiếu sự cố','<section class="section">'+incidentTable(data)+'</section>')}function scan(){shell('Báo sự cố bằng QR','<div class="form"><p class="muted">Trong bản demo, nhập QR token in trên thiết bị.</p><label>QR token</label><input id="qr" placeholder="demo-mc-a203-01"><button id="lookup" class="button" style="margin-top:16px">Tra cứu thiết bị</button><div id="scan-result"></div></div>');$('#lookup').onclick=async()=>{try{const a=await api('/scan/'+encodeURIComponent($('#qr').value));$('#scan-result').innerHTML='<hr><h3>'+esc(a.name)+'</h3><p>'+esc(a.location)+' · '+esc(a.assetCode)+'</p><label>Mô tả sự cố</label><textarea id="desc" rows="4" placeholder="Ví dụ: Máy vẫn có nguồn nhưng không có hình ảnh"></textarea><button id="report" class="button" style="margin-top:12px">Gửi phiếu</button>';$('#report').onclick=async()=>{const desc=$('#desc').value;const d=await api('/incidents',{method:'POST',body:JSON.stringify({assetId:a.id,title:'Báo hỏng '+a.name,description:desc})});$('#scan-result').innerHTML='<p class="badge">Đã tạo '+esc(d.incidentCode)+'</p><p>'+esc(d.aiSuggestion?.summary||'Đã tiếp nhận')+'</p>'}}catch(e){$('#scan-result').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}}start();
</script></body></html>
